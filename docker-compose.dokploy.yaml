# WhatsApp MCP Extended, Dokploy için uyarlanmış compose dosyası.
# Orijinal: https://github.com/FelixIsaac/whatsapp-mcp-extended (docker-compose.yaml)
#
# Orijinalden farklar:
#  1. ./store yerine adlandırılmış volume (wa_store). Dokploy her dağıtımda repoyu
#     yeniden klonladığı için ./store silinir ve WhatsApp oturumu kaybolurdu.
#  2. Köprü ve MCP servisi için host portu yok. Başka projelerle port çakışmaz.
#  3. MCP servisi ayrıca dokploy-network'e katılıyor, Obot buradan ulaşır.
#     Köprü yalnızca whatsapp_internal ağında kalır.
#  4. Web arayüzü yalnızca sunucunun 127.0.0.1:8090 adresine açık (SSH tüneliyle eşleştirme için).

services:
  whatsapp-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - wa_store:/app/whatsapp-bridge/store
    environment:
      - TZ=UTC
      - API_KEY=${API_KEY:?API_KEY is required}
      - DISABLE_AUTH_CHECK=${DISABLE_AUTH_CHECK:-false}
      - API_BIND_HOST=0.0.0.0
      # Gönderimi belirli kişilerle sınırlamak için aşağıdaki satırı açın ve
      # Dokploy Environment sekmesinde WHATSAPP_ALLOWLIST_JIDS değerini girin.
      # Hangi servisin okuduğunu repoda `grep -r WHATSAPP_ALLOWLIST_JIDS .` ile doğrulayın.
      # - WHATSAPP_ALLOWLIST_JIDS=${WHATSAPP_ALLOWLIST_JIDS}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - whatsapp_internal

  whatsapp-mcp:
    # Sabit ad, dokploy-network üzerinde başka projelerle ad çakışmasını önler.
    container_name: whatsapp-mcp-extended
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    expose:
      - "8081"
    volumes:
      - wa_store:/app/store
    environment:
      - TZ=UTC
      - DEBUG=true
      - MCP_TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8081
      - WHATSAPP_MCP_TOOLSETS=${WHATSAPP_MCP_TOOLSETS:-all}
      - BRIDGE_HOST=whatsapp-bridge
      - API_KEY=${API_KEY}
      # - WHATSAPP_ALLOWLIST_JIDS=${WHATSAPP_ALLOWLIST_JIDS}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8081), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      whatsapp-bridge:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - whatsapp_internal
      - dokploy-network

  web-ui:
    build:
      context: .
      dockerfile: Dockerfile.web-ui
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
    ports:
      # Yalnızca sunucunun kendisine açık. Dışarıdan SSH tüneliyle erişin.
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      whatsapp-bridge:
        condition: service_started
    restart: unless-stopped
    networks:
      - whatsapp_internal

volumes:
  wa_store:

networks:
  whatsapp_internal:
    driver: bridge
  dokploy-network:
    external: true
